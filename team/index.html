<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team — The Protocol Institute</title>
  <meta name="description" content="The people behind the Protocol Institute.">
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="interior-wrapper">

  <header id="site-header"></header>

  <main class="interior-main">
    <div class="container">

      <div class="page-header">
        <h1>Team</h1>
      </div>

      <p class="team-intro">For general inquiries, please email <a href="mailto:team@protocol-institute.org">team@protocol-institute.org</a>.</p>

      <div id="team-list"></div>

    </div>
  </main>

  <footer class="site-footer">
    <nav class="footer-nav" aria-label="Footer navigation">
      <a href="/team">Team</a>
      <a href="/network">Network</a>
      <a href="/consulting">Consulting</a>
      <a href="/symposium-2026">Symposium</a>
      <a href="/contact">Contact</a>
    </nav>
    <p>&copy; 2025 The Protocol Institute</p>
  </footer>

</div>

<script src="/js/main.js"></script>
<script>
(function () {
  function photoSrc(key) {
    if (!key) return null;
    if (key.startsWith('http://') || key.startsWith('https://')) return key;
    return '/assets/' + key;
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderTeamMember(m) {
    const isAi = m.type === 'ai';
    const src = photoSrc(m.photo_r2_key);
    const photoHtml = src
      ? `<img src="${escHtml(src)}" alt="${escHtml(m.name)}"${isAi ? ' class="team-photo-ai"' : ''}>`
      : `<div class="team-photo-placeholder"><span>Photo</span></div>`;

    const contactHtml = isAi
      ? (m.website ? `<a class="team-link" href="${escHtml(m.website)}">Learn more →</a>` : '')
      : (m.consulting_contact
          ? `<a class="team-email" href="${m.consulting_contact.includes('@') ? 'mailto:' : ''}${escHtml(m.consulting_contact)}">${escHtml(m.consulting_contact)}</a>`
          : '');

    const extraLinks = m.website && m.website.startsWith('/') && m.website !== '/'
      ? (m.slug === 'humboldt'
          ? `<a class="team-link" href="https://humboldt.protocol-institute.org/notebook/" style="margin-left:1em;" target="_blank" rel="noopener">Lab notebook →</a>`
          : '')
      : '';

    return `<section class="team-member" id="${escHtml(m.slug)}">
      <div class="team-photo">
        ${photoHtml}
      </div>
      <div class="team-bio">
        <h2 class="team-name">${escHtml(m.name)}</h2>
        <p class="team-role">${escHtml(m.team_title || '')}</p>
        <p>${escHtml(m.bio || '')}</p>
        ${contactHtml}${extraLinks}
      </div>
    </section>`;
  }

  fetch('/api/members?tag=team')
    .then(r => r.json())
    .then(data => {
      const members = data.members || [];
      document.getElementById('team-list').innerHTML = members.map(renderTeamMember).join('');
    })
    .catch(() => {
      document.getElementById('team-list').innerHTML =
        '<p style="color:#8A8A8A;font-style:italic;">Unable to load team members. Please try again later.</p>';
    });
}());
</script>
</body>
</html>
