# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/

name = "protocol-institute-website"
pages_build_output_dir = "."
compatibility_date = "2025-01-01"
# account_id is set via CLOUDFLARE_ACCOUNT_ID env var (see .env)

# No build step — files are served as-is from the repo root.
# The _redirects file (already present) is natively supported by CF Pages.

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "pi-assets"

[[d1_databases]]
binding = "DB"
database_name = "pi-members"
database_id = "a86730ae-27b8-41e7-b8d2-927efcada8e2"
