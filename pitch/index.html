<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Protocol Institute 2027 Prospectus — The Protocol Institute</title>
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css?v=58">
  <link rel="stylesheet" href="/css/pitch.css?v=3">
</head>
<body>

<div class="interior-wrapper">

  <header id="site-header"></header>

  <main class="interior-main">
    <div class="container">

      <!-- Unlisted: not in nav, sitemap or search. Visible to researchers and above (tag_sig, research leads, team, admins); editing is admin-only.
           The document is assembled by scripts/pitch/build_pitch.py (see CLAUDE.md, Institute overview)
           and served by /api/pitch/*; this page only displays it. -->
      <div class="page-header">
        <h1 id="pitch-title">Protocol Institute 2027 Prospectus</h1>
      </div>

      <p id="pitch-status" class="projects-intro">Loading…</p>

      <div class="pitch-layout">
      <nav id="pitch-toc" class="pitch-toc" aria-label="Contents" style="display:none;"></nav>

      <div id="pitch-bar" class="pitch-bar" style="display:none;">
        <span id="pitch-built"></span>
        <a id="pitch-pdf" class="form-btn" href="/api/pitch/pdf">Download PDF</a>
      </div>

      <article id="pitch-doc" class="pitch-doc"></article>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <nav class="footer-nav" aria-label="Footer navigation">
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
    <p>&copy; 2026 The Protocol Institute</p>
  </footer>

</div>

<script src="/js/main.js?v=58"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const status = $('pitch-status');
  const signIn = '<a href="/members/join?return=' + encodeURIComponent('/pitch') + '">Log in</a> to view the Protocol Institute 2027 Prospectus.';

  // Contents: one link per h2 (h3s indented under it), with the section in view highlighted.
  function buildToc(doc) {
    const heads = [...doc.querySelectorAll('h2, h3')];
    if (heads.length < 3) return;
    const used = new Set();
    const links = heads.map(h => {
      let id = h.id || h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
      while (used.has(id) || (document.getElementById(id) && document.getElementById(id) !== h)) id += '-2';
      used.add(id); h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id; a.textContent = h.textContent;
      if (h.tagName === 'H3') a.className = 'sub';
      return a;
    });
    const toc = $('pitch-toc');
    const title = document.createElement('p'); title.className = 'pitch-toc-title'; title.textContent = 'Contents';
    const inner = document.createElement('div'); inner.className = 'pitch-toc-inner';
    inner.append(title, ...links); toc.append(inner);
    toc.style.display = '';
    if (!('IntersectionObserver' in window)) return;
    const byId = new Map(links.map(a => [a.hash.slice(1), a]));
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) {
        links.forEach(a => a.classList.remove('active'));
        byId.get(e.target.id).classList.add('active');
      } });
    }, { rootMargin: '0px 0px -75% 0px' });
    heads.forEach(h => io.observe(h));
  }

  fetch('/api/pitch/meta').then(async res => {
    if (res.status === 401) { status.innerHTML = signIn; return; }
    if (res.status === 403) { status.textContent = 'The 2027 Prospectus is limited to Institute researchers and team.'; return; }
    if (res.status === 404) { status.textContent = 'The prospectus has not been built yet.'; return; }
    if (!res.ok) { status.textContent = 'Could not load the prospectus.'; return; }
    const meta = await res.json();
    const html = await fetch('/api/pitch/html').then(r => r.ok ? r.text() : Promise.reject());
    // Trusted: assembled server-side from our own sources, API text HTML-escaped.
    const doc = $('pitch-doc');
    doc.innerHTML = html;
    status.style.display = 'none';
    $('pitch-bar').style.display = '';
    $('pitch-built').textContent = 'Assembled ' + new Date(meta.built_at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) +
      ' · rebuilt when the text is saved, and weekly';
    // The page header carries the title, so the document's own h1 would repeat it.
    const h1 = doc.querySelector('h1');
    if (h1) { $('pitch-title').textContent = h1.textContent; h1.remove(); }
    buildToc(doc);
    // Edit link for admins, the site-wide way (cf. programs/edit): the server re-checks on save.
    fetch('/api/members/me').then(r => r.ok ? r.json() : null).then(me => {
      if (me && me.member && me.member.is_admin) PI.editLink('/pages/edit?key=pitch/overview');
    }).catch(() => {});
  }).catch(() => { status.textContent = 'Could not load the prospectus.'; });
})();
</script>
</body>
</html>
