<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Page — The Protocol Institute</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css?v=58">
</head>
<body>

<div class="interior-wrapper">

  <header id="site-header"></header>

  <main class="interior-main">
    <div class="container">

      <div id="pg-loading"><p class="section-loading">Loading…</p></div>
      <div id="pg-denied" style="display:none;"><p class="projects-intro" id="pg-denied-msg"></p></div>

      <div id="pg-content" style="display:none;">
        <div class="project-detail-breadcrumb"><a id="pg-view" href="/">View page →</a></div>
        <div class="page-header">
          <h1 id="pg-title">Edit page</h1>
        </div>

        <form id="pg-form" class="member-form">
          <div class="form-group">
            <label class="form-label" for="pg-md">Page text</label>
            <p class="form-hint">Markdown. The page's heading comes from the page itself, so don't start with a <code># Title</code> line. Raw HTML works for the odd thing markdown can't do (the About page's logo uses it).</p>
            <textarea class="form-textarea" id="pg-md"></textarea>
          </div>
          <div class="form-save-bar">
            <button type="submit" class="form-btn" id="pg-save">Save page</button>
            <div class="form-msg" id="pg-msg" style="display:none;"></div>
          </div>
        </form>
      </div>

    </div>
  </main>

  <footer class="site-footer"></footer>

</div>

<script src="/js/main.js"></script>
<script src="/js/markdown.js?v=58"></script>
<script src="/js/md-editor.js?v=56"></script>
<script>
// /pages/edit?key=<page_key> — admin editor for the site's standalone markdown
// pages and page blocks (managed_pages rows outside any program, static/<name>).
// Program About pages are edited in /programs/edit instead. Viewer side:
// js/managed-page.js (About, Support Us) and js/page-blocks.js (everything else,
// migration 057), both of which show admins the Edit link that leads here.
(function () {
  const $ = id => document.getElementById(id);
  const key = new URLSearchParams(location.search).get('key') || '';
  // Where each page lives, for the View link and the redirect after saving.
  const PAGES = {
    'static/about':   { title: 'About',      href: '/about' },
    'static/support': { title: 'Support Us', href: '/support' },
    "static/home": { title: "Home", href: "/" },
    "static/contact": { title: "Contact", href: "/contact" },
    "static/network": { title: "Network", href: "/network" },
    "static/workshops": { title: "Corporate Workshops", href: "/workshops" },
    "static/humboldt": { title: "Humboldt", href: "/humboldt" },
    "static/license": { title: "CC+ License", href: "/license" },
    "static/values": { title: "Core Values", href: "/values" },
    "pitch/overview": { title: "Institute Overview (private)", href: "/pitch" },
    "static/consulting-policies": { title: "Consulting Network Policies", href: "/consulting/policies" },
    "static/events-calendar": { title: "Events — Calendar intro", href: "/events" },
    "static/events-calendar-note": { title: "Events — Calendar note", href: "/events" },
    "static/events-history": { title: "Events — History intro", href: "/events?view=history" },
    "static/research": { title: "Projects — intro", href: "/research" },
    "static/research-projects": { title: "Projects — Projects tab intro", href: "/research" },
    "static/research-challenges": { title: "Projects — Challenges tab intro", href: "/research?view=challenges" },
    "static/programs": { title: "Programs — intro", href: "/programs" },
    "static/members": { title: "Members — intro", href: "/members" },
    "static/research-groups": { title: "Research Groups — intro", href: "/research-groups" },
    "static/members-team": { title: "Members — Team blurb", href: "/members?filter=team" },
    "static/members-extended-team": { title: "Members — Extended Team blurb", href: "/members?filter=extended_team" },
    "static/members-community-lead": { title: "Members — Research Leads blurb", href: "/members?filter=community_lead" },
    "static/members-consultant": { title: "Members — Consultants blurb", href: "/members?filter=consultant" },
    "static/members-tag-sop23": { title: "Members — SoP '23 blurb", href: "/members?filter=tag_sop23" },
    "static/members-tag-sop24": { title: "Members — SoP '24 blurb", href: "/members?filter=tag_sop24" },
    "static/members-tag-sop25": { title: "Members — SoP '25 blurb", href: "/members?filter=tag_sop25" },
    "static/members-tag-ps25": { title: "Members — Protocol School 2025 blurb", href: "/members?filter=tag_ps25" },
    "static/members-tag-sig": { title: "Members — Researchers blurb", href: "/members?filter=tag_sig" },
    "static/members-tag-symposium-25": { title: "Members — Symposium 2025 blurb", href: "/members?filter=tag_symposium_25" },
    "static/members-tag-guest-speaker": { title: "Members — Guest Speakers blurb", href: "/members?filter=tag_guest_speaker" },
  };
  const page = PAGES[key] || { title: key, href: '/' };

  function deny(msg) {
    $('pg-loading').style.display = 'none';
    $('pg-denied-msg').innerHTML = msg;
    $('pg-denied').style.display = '';
  }
  if (!/^(static|pitch)\/[a-z0-9-]+$/.test(key)) { deny('No page to edit.'); return; }

  const editor = PIMdEditor.attach($('pg-md'), { wide: true, pageKey: key, onSave: () => $('pg-form').requestSubmit() });
  let guard = null;

  Promise.all([
    fetch('/api/members/me').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('/api/pages/' + key).then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([me, existing]) => {
    if (!me || !me.member) {
      deny('<a href="/members/join?return=' + encodeURIComponent(location.pathname + location.search) + '">Sign in</a> to edit this page.');
      return;
    }
    if (!me.member.is_admin) { deny('Only admins can edit this page.'); return; }
    document.title = 'Edit ' + page.title + ' — The Protocol Institute';
    $('pg-title').textContent = 'Edit ' + page.title;
    $('pg-view').href = page.href;
    editor.setValue((existing && existing.content_md) || '');
    $('pg-loading').style.display = 'none';
    $('pg-content').style.display = '';
    guard = PIMdEditor.guard($('pg-form'), $('pg-save'));
    guard.snapshot();
  });

  $('pg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('pg-save'), msg = $('pg-msg');
    btn.disabled = true; btn.textContent = 'Saving…'; msg.style.display = 'none';
    try {
      const res = await fetch('/api/pages/' + key, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content_md: $('pg-md').value, title: page.title }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Save failed.');
      if (guard) guard.snapshot();
      msg.className = 'form-msg form-msg--success';
      msg.innerHTML = 'Saved. <a href="' + page.href + '">View page →</a>';
    } catch (err) {
      msg.className = 'form-msg form-msg--error';
      msg.textContent = err.message;
    }
    msg.style.display = '';
    btn.disabled = false; btn.textContent = 'Save page';
  });
}());
</script>
</body>
</html>
