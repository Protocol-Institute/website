<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Special Session — Protocol Symposium 2026</title>
  <meta name="description" content="Memory special session at Protocol Symposium 2026.">
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .session-meta-table { width:100%; border-collapse:collapse; margin-bottom:2rem; font-size:0.9rem; }
    .session-meta-table td { padding:0.45rem 0; vertical-align:top; }
    .session-meta-table td:first-child { width:120px; font-weight:500; color:#5A5A5A;
      font-size:0.78rem; letter-spacing:0.07em; text-transform:uppercase; padding-right:1.5rem; }
    .stub { color:#8A8A8A; font-style:italic; }

    .proposal-card { border:1px solid #D8D5CF; border-radius:4px; padding:1.25rem 1.5rem;
      margin-bottom:0.75rem; background:#EBF2FF; border-color:#C0D4F0; }
    .edit-own-btn {
      display:inline-block; margin-top:0.75rem; padding:0.4rem 0.9rem;
      background:#C0392B; color:#fff; font-family:inherit;
      font-size:0.8rem; font-weight:600; letter-spacing:0.04em;
      border:none; cursor:pointer; }
    .edit-own-btn:hover { background:#A93226; }
    .proposal-title { font-family:'Cormorant Garamond',serif; font-size:1.2rem;
      font-weight:600; color:#1A1A1A; margin-bottom:0.3rem; line-height:1.3; }
    .proposal-speaker { font-size:0.82rem; font-weight:500; color:#5A5A5A;
      text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.65rem; }
    .proposal-abstract { font-size:0.92rem; color:#3A3A3A; line-height:1.65; }
    .abstract-clamp { display:-webkit-box; -webkit-line-clamp:4;
      -webkit-box-orient:vertical; overflow:hidden; }
    .abstract-toggle { font-size:0.8rem; color:#2A6B6B; cursor:pointer;
      background:none; border:none; padding:0; margin-top:0.4rem; display:block; }
    .gate-msg { text-align:center; padding:4rem 0; color:#8A8A8A; }
    .gate-msg a { color:#2A6B6B; }
    .talks-empty { color:#8A8A8A; font-style:italic; font-size:0.92rem; padding:1.5rem 0; }
    .edit-bar { margin-top:0.6rem; }
    .edit-link { font-size:0.78rem; color:#2A6B6B; cursor:pointer;
      background:none; border:none; padding:0; text-decoration:underline; }
    .edit-form { margin-top:0.75rem; padding-top:0.75rem; border-top:1px solid #E0DDD8; }
    .edit-title-input { width:100%; box-sizing:border-box; font-family:'Cormorant Garamond',serif;
      font-size:1.1rem; font-weight:600; padding:0.35rem 0.5rem;
      border:1px solid #C8C5C0; margin-bottom:0.5rem; }
    .edit-abstract-input { width:100%; box-sizing:border-box; font-family:inherit;
      font-size:0.9rem; padding:0.4rem 0.5rem; border:1px solid #C8C5C0;
      min-height:120px; resize:vertical; line-height:1.6; margin-bottom:0.5rem; }
    .edit-actions { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }
    .edit-cancel { font-family:inherit; font-size:0.85rem; color:#5A5A5A; cursor:pointer;
      background:none; border:none; padding:0; text-decoration:underline; }
    .edit-msg { font-size:0.8rem; color:#8A1F2E; }
    .session-field-group { margin-bottom:0.85rem; }
    .session-field-label { display:block; font-size:0.75rem; font-weight:500;
      letter-spacing:0.08em; text-transform:uppercase; color:#5A5A5A; margin-bottom:0.3rem; }
  </style>
</head>
<body>
<div class="interior-wrapper">
  <header id="site-header"></header>
  <main class="interior-main">
    <div class="container">

      <div class="page-header">
        <p class="event-kicker">Special Session &mdash; Protocol Symposium 2026</p>
        <h1>Memory</h1>
      </div>

      <div id="gate-view" class="gate-msg" style="display:none;">
        <p>Member access required. <a href="/members/join/">Log in →</a></p>
      </div>

      <div id="main-view" style="display:none;">

        <div class="draft-banner" id="draft-banner">Session details in progress — date, times, and agenda to be confirmed</div>

        <h2>About This Session</h2>
        <p id="meta-description" class="stub">Session description to be added.</p>

        <h2>Agenda</h2>
        <p id="meta-agenda" class="stub">Agenda to be confirmed.</p>

        <div id="session-edit-bar" style="display:none;margin-bottom:1.5rem;">
          <button class="edit-own-btn" onclick="startSessionEdit()">You own this item — edit details</button>
        </div>
        <div id="session-edit-form" class="edit-form" style="display:none;margin-bottom:2rem;">
          <div class="session-field-group"><label class="session-field-label">About this session</label>
            <textarea class="edit-abstract-input" id="edit-description" style="min-height:80px;"></textarea></div>
          <div class="session-field-group"><label class="session-field-label">Agenda</label>
            <textarea class="edit-abstract-input" id="edit-agenda" style="min-height:80px;"></textarea></div>
          <div class="edit-actions">
            <button class="form-btn" onclick="saveSessionEdit()">Save</button>
            <button class="edit-cancel" onclick="cancelSessionEdit()">Cancel</button>
            <span class="edit-msg" id="session-edit-msg"></span>
          </div>
        </div>

        <h2>Talks</h2>
        <p id="talks-loading" style="color:#8A8A8A;font-style:italic;">Loading&hellip;</p>
        <div id="talks-list"></div>

        <div style="margin-top:2.5rem;font-size:0.85rem;">
          <a href="/events/protocol-symposium-2026/submissions/" style="color:#2A6B6B;">← All submissions</a>
          &ensp;&middot;&ensp;
          <a href="/events/protocol-symposium-2026/" style="color:#2A6B6B;">Symposium 2026 →</a>
        </div>

      </div>

    </div>
  </main>
  <footer class="site-footer"></footer>
</div>
<script src="/js/main.js"></script>
<script>
(function () {
  const SESSION = 'Memory';

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const SESSION_SLUG = SESSION.toLowerCase().replace(/\s+/g, '-');
  let memberEmail = '', isAdmin = false;
  const store = {};

  fetch('/api/members/me')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => {
      if (!d.member) throw new Error();
      memberEmail = (d.member.email || '').toLowerCase();
      isAdmin = !!d.member.is_admin;
      document.getElementById('main-view').style.display = '';
      return Promise.all([
        fetch('/api/symposium/sessions/' + SESSION_SLUG).then(r => r.json()),
        fetch('/api/symposium/proposals').then(r => r.json()),
      ]);
    })
    .then(([sessionData, proposalsData]) => {
      // Populate session metadata
      const sess = sessionData.session || {};
      function setMeta(id, val, fallback) {
        const el = document.getElementById(id);
        if (val) { el.textContent = val; el.classList.remove('stub'); }
        else { el.textContent = fallback; el.classList.add('stub'); }
      }
      setMeta('meta-description', sess.description, 'Session description to be added.');
      setMeta('meta-agenda',      sess.agenda,      'Agenda to be confirmed.');

      // Hide draft banner once all metadata fields are filled
      const allFilled = sess.description && sess.agenda;
      if (allFilled) document.getElementById('draft-banner').style.display = 'none';

      // Show edit bar for owner or admin
      const isOwner = sess.owner_email && memberEmail === sess.owner_email.toLowerCase();
      if (isAdmin || isOwner) document.getElementById('session-edit-bar').style.display = '';

      const data = proposalsData;
      const proposals = (data.proposals || [])
        .filter(p => p.type === 'talk' && (p.session || 'General') === SESSION)
        .sort((a, b) => {
          const na = (a.speaker_name || '').split(/\s+/)[0].toLowerCase();
          const nb = (b.speaker_name || '').split(/\s+/)[0].toLowerCase();
          return na.localeCompare(nb);
        });

      document.getElementById('talks-loading').style.display = 'none';
      const list = document.getElementById('talks-list');

      if (!proposals.length) {
        list.innerHTML = '<p class="talks-empty">No talks assigned to this session yet.</p>';
        return;
      }

      proposals.forEach(p => { store[p.id] = { title: p.title, abstract: p.abstract || '' }; });

      list.innerHTML = proposals.map(p => {
        const ownerEmail = (p.speaker_email || p.organizer_email || '').toLowerCase();
        const isOwner = !isAdmin && memberEmail && memberEmail === ownerEmail;
        return `
        <div class="proposal-card">
          <div class="proposal-title" id="title-${p.id}">${esc(p.title)}</div>
          <div class="proposal-speaker">${esc(p.speaker_name || '')}</div>
          <div class="proposal-abstract" id="abs-wrap-${p.id}">
            <div class="abstract-clamp" id="abs-${p.id}">${esc(p.abstract || '')}</div>
            <button class="abstract-toggle" onclick="toggleAbs(${p.id})">Show more ▾</button>
          </div>
          ${isAdmin ? `
          <div class="edit-bar">
            <a class="edit-own-btn" href="/admin/proposals.html?id=${p.id}">You own this item — edit details</a>
          </div>` : isOwner ? `
          <div class="edit-bar" id="edit-bar-${p.id}">
            <button class="edit-own-btn" onclick="startEdit(${p.id})">You own this item — edit details</button>
          </div>
          <div class="edit-form" id="edit-form-${p.id}" style="display:none;">
            <input class="edit-title-input" id="edit-title-${p.id}" type="text">
            <textarea class="edit-abstract-input" id="edit-abstract-${p.id}"></textarea>
            <div class="edit-actions">
              <button class="form-btn" onclick="saveEdit(${p.id})">Save</button>
              <button class="edit-cancel" onclick="cancelEdit(${p.id})">Cancel</button>
              <span class="edit-msg" id="edit-msg-${p.id}"></span>
            </div>
          </div>` : ''}
        </div>`;
      }).join('');
    })
    .catch(() => {
      document.getElementById('gate-view').style.display = '';
    });

  window.startSessionEdit = function () {
    document.getElementById('session-edit-form').style.display = '';
    document.getElementById('session-edit-bar').style.display = 'none';
    document.getElementById('edit-date').value        = document.getElementById('meta-date').classList.contains('stub')  ? '' : document.getElementById('meta-date').textContent;
    document.getElementById('edit-start').value       = document.getElementById('meta-start').classList.contains('stub') ? '' : document.getElementById('meta-start').textContent;
    document.getElementById('edit-end').value         = document.getElementById('meta-end').classList.contains('stub')   ? '' : document.getElementById('meta-end').textContent;
    document.getElementById('edit-description').value = document.getElementById('meta-description').classList.contains('stub') ? '' : document.getElementById('meta-description').textContent;
    document.getElementById('edit-agenda').value      = document.getElementById('meta-agenda').classList.contains('stub')      ? '' : document.getElementById('meta-agenda').textContent;
  };

  window.cancelSessionEdit = function () {
    document.getElementById('session-edit-form').style.display = 'none';
    document.getElementById('session-edit-bar').style.display = '';
    document.getElementById('session-edit-msg').textContent = '';
  };

  window.saveSessionEdit = async function () {
    const msg = document.getElementById('session-edit-msg');
    const body = {
      description: document.getElementById('edit-description').value.trim(),
      agenda:      document.getElementById('edit-agenda').value.trim(),
    };
    try {
      const res = await fetch('/api/symposium/sessions/' + SESSION_SLUG, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      function setMeta(id, val, fallback) {
        const el = document.getElementById(id);
        if (val) { el.textContent = val; el.classList.remove('stub'); }
        else { el.textContent = fallback; el.classList.add('stub'); }
      }
      setMeta('meta-description', body.description, 'Session description to be added.');
      setMeta('meta-agenda',      body.agenda,      'Agenda to be confirmed.');
      const allFilled = body.description && body.agenda;
      document.getElementById('draft-banner').style.display = allFilled ? 'none' : '';
      cancelSessionEdit();
    } catch (e) {
      msg.textContent = e.message;
    }
  };

  window.toggleAbs = function (id) {
    const el = document.getElementById('abs-' + id);
    const btn = el.nextElementSibling;
    const clamped = el.classList.toggle('abstract-clamp');
    btn.textContent = clamped ? 'Show more ▾' : 'Show less ▴';
  };

  window.startEdit = function (id) {
    const d = store[id];
    document.getElementById('edit-title-' + id).value = d.title;
    document.getElementById('edit-abstract-' + id).value = d.abstract;
    document.getElementById('title-' + id).style.display = 'none';
    document.getElementById('abs-wrap-' + id).style.display = 'none';
    document.getElementById('edit-bar-' + id).style.display = 'none';
    document.getElementById('edit-form-' + id).style.display = '';
  };

  window.cancelEdit = function (id) {
    document.getElementById('title-' + id).style.display = '';
    document.getElementById('abs-wrap-' + id).style.display = '';
    document.getElementById('edit-bar-' + id).style.display = '';
    document.getElementById('edit-form-' + id).style.display = 'none';
  };

  window.saveEdit = async function (id) {
    const title    = document.getElementById('edit-title-' + id).value.trim();
    const abstract = document.getElementById('edit-abstract-' + id).value.trim();
    const msg      = document.getElementById('edit-msg-' + id);
    if (!title) { msg.textContent = 'Title required.'; return; }
    try {
      const res = await fetch('/api/symposium/proposals/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, abstract }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      store[id] = { title, abstract };
      document.getElementById('title-' + id).textContent = title;
      document.getElementById('abs-' + id).textContent = abstract;
      cancelEdit(id);
    } catch (e) {
      msg.textContent = e.message;
    }
  };
}());
</script>
</body>
</html>
