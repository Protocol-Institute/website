<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protocol Hackathon: Securing Stigmergic Systems — Protocol Symposium 2026</title>
  <meta name="description" content="Workshop details for Protocol Hackathon: Securing Stigmergic Systems at Protocol Symposium 2026.">
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .section-label { font-family:'Cormorant Garamond',serif; font-size:1rem; font-weight:600;
      letter-spacing:0.06em; text-transform:uppercase; color:#8A8A8A;
      border-top:1px solid #E0DDD8; padding-top:1.5rem; margin-top:1.5rem; margin-bottom:0.6rem; }
    .gate-msg { text-align:center; padding:4rem 0; color:#8A8A8A; }
  </style>
</head>
<body>
<div class="interior-wrapper">
  <header id="site-header"></header>
  <main class="interior-main">
    <div class="container">
      <div id="gate-view" class="gate-msg" style="display:none;">
        <p>This page is available to Protocol Institute members.<br>
        <a href="/members/join?return=/events/protocol-symposium-2026/submissions/workshops/workshop-protocol-hackathon-securing-stigmergic/" style="color:#2A6B6B;">Log in →</a></p>
      </div>
      <div id="main-view" style="display:none;">
        <p style="margin-bottom:1rem;font-size:0.85rem;">
          <a href="/events/protocol-symposium-2026/submissions/" style="color:#2A6B6B;">← Accepted Submissions</a>
        </p>
        <div id="proposal-body"></div>
      </div>
    </div>
  </main>
  <footer class="site-footer"></footer>
</div>
<script src="/js/main.js"></script>
<script>
const PROPOSAL_ID = 26;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderInline(s){return s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');}
function renderText(text){
  if(!text||text.trim()===''||text.trim().toLowerCase()==='n/a') return '';
  return esc(text).split(/\n\n+/).map(block=>{
    const lines=block.split('\n').map(l=>l.trimEnd());
    const nonempty=lines.filter(l=>l.trim());
    if(nonempty.length>1&&nonempty.every(l=>l.trim().startsWith('- ')))
      return '<ul style="line-height:1.8;padding-left:1.4rem;">'+nonempty.map(l=>`<li>${renderInline(l.replace(/^- /,''))}</li>`).join('')+'</ul>';
    return `<p style="line-height:1.7;">${renderInline(block.replace(/\n/g,'<br>'))}</p>`;
  }).join('');
}
const TRACK_LABELS={'SIGPfB':'SIGPfB (Protocols for Business)','SIGFPT':'SIGFPT (Formal Protocol Theory)','MRG':'MRG (Model Roundtable)','ProtFiSIG':'ProtFiSIG (Protocol Fiction)','Alumni':'Alumni Track'};
function renderProposal(p){
  const track=TRACK_LABELS[p.track]||p.track||'';
  const sec=t=>`<h2 class="section-label">${t}</h2>`;
  let html=`<div class="page-header"><h1>${esc(p.title)}</h1></div>
    <p style="font-size:0.82rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#8A8A8A;margin-bottom:1.5rem;">Workshop${track?' · '+esc(track):''}</p>`;
  if(p.abstract)   html+=sec('Abstract')+renderText(p.abstract);
  if(p.audience)   html+=sec('Audience')+renderText(p.audience);
  if(p.takeaways)  html+=sec('What participants will take away')+renderText(p.takeaways);
  if(p.activities) html+=sec('What participants will do')+renderText(p.activities);
  const orgs=[];
  if(p.organizer_name)    orgs.push({name:p.organizer_name,bio:p.organizer_bio});
  if(p.co_organizer_name) orgs.push({name:p.co_organizer_name,bio:p.co_organizer_bio});
  if(orgs.length){
    html+=sec('Organizers');
    html+=orgs.map((o,i)=>`<div class="team-member"${i?' style="margin-top:1.5rem;"':''}>
      <div class="team-bio"><h3 class="team-name">${esc(o.name)}</h3>${renderText(o.bio)}</div></div>`).join('');
  }
  if(p.comments&&p.comments.trim()&&p.comments.trim().toLowerCase()!=='n/a')
    html+=sec('Notes')+renderText(p.comments);
  return html;
}
fetch(`/api/symposium/proposals/${PROPOSAL_ID}`)
  .then(r=>{if(r.status===401||r.status===403){document.getElementById('gate-view').style.display='';return null;}if(!r.ok)throw new Error();return r.json();})
  .then(data=>{if(!data)return;document.getElementById('proposal-body').innerHTML=renderProposal(data.proposal);document.getElementById('main-view').style.display='';})
  .catch(()=>{document.getElementById('gate-view').style.display='';});
</script>
</body>
</html>
