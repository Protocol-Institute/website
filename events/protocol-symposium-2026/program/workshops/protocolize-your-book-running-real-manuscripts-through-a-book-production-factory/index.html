<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protocolize Your Book — Protocol Symposium 2026</title>
  <meta name="description" content="Workshop details for Protocolize Your Book: Running Real Manuscripts Through a Book Production Factory at Protocol Symposium 2026.">
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .section-label { font-family:'Cormorant Garamond',serif; font-size:1rem; font-weight:600;
      letter-spacing:0.06em; text-transform:uppercase; color:#8A8A8A;
      border-top:1px solid #E0DDD8; padding-top:1.5rem; margin-top:1.5rem; margin-bottom:0.6rem; }
    .gate-msg { text-align:center; padding:4rem 0; color:#8A8A8A; }
    .edit-own-btn { display:inline-block; padding:0.4rem 0.9rem; background:#C0392B; color:#fff;
      font-family:inherit; font-size:0.8rem; font-weight:600; letter-spacing:0.04em;
      border:none; cursor:pointer; }
    .edit-own-btn:hover { background:#A93226; }
    .comment-section { margin-top:1.5rem; padding-top:1rem; border-top:1px solid #E0DDD8; }
    .comment-toggle { font-size:0.82rem; color:#2A6B6B; cursor:pointer; background:none; border:none; padding:0; font-family:inherit; }
    .comments-body { margin-top:0.75rem; }
    .comment-item { padding:0.5rem 0; border-bottom:1px solid #F0EDE8; }
    .comment-item:last-child { border-bottom:none; }
    .comment-author { font-size:0.75rem; font-weight:500; color:#8A8A8A; margin-bottom:0.2rem; }
    .comment-text { font-size:0.88rem; color:#3A3A3A; line-height:1.55; }
    .comment-compose { margin-top:0.75rem; }
    .comment-input { width:100%; box-sizing:border-box; font-family:inherit; font-size:0.88rem;
      padding:0.5rem; border:1px solid #C8C5C0; min-height:60px; resize:vertical; background:#fff; }
    .comment-submit-btn { font-family:inherit; font-size:0.78rem; font-weight:500;
      padding:0.3rem 0.8rem; background:#2A6B6B; color:#fff; border:none; cursor:pointer; margin-top:0.4rem; }
    .comment-submit-btn:disabled { opacity:0.5; cursor:default; }
    .comment-msg { font-size:0.78rem; margin-left:0.5rem; }
    .workshop-sessions { list-style:none; margin:0 0 0.75rem; padding:0; font-size:0.85rem; color:#3A3A3A; }
    .workshop-sessions li { padding:0.15rem 0; }
    .workshop-session-note { color:#8A8A8A; font-style:italic; }
    .workshop-register-btn { display:inline-block; font-size:0.85rem; font-weight:600;
      color:#fff; background:#2A6B6B; padding:0.5rem 1.1rem; margin-bottom:1rem;
      text-decoration:none; letter-spacing:0.02em; }
    .workshop-register-btn:hover { background:#20504F; }
  </style>
</head>
<body>
<div class="interior-wrapper">
  <header id="site-header"></header>
  <main class="interior-main">
    <div class="container">
      <div id="gate-view" class="gate-msg" style="display:none;">
        <p>Unable to load workshop details. Please try again later.</p>
      </div>
      <div id="main-view" style="display:none;">
        <p style="margin-bottom:1rem;font-size:0.85rem;">
          <a href="/events/protocol-symposium-2026/" style="color:#2A6B6B;">← Program</a>
        </p>
        <div id="workshop-edit-bar" style="display:none;margin-bottom:0.75rem;"></div>
        <div id="workshop-edit-form" style="display:none;margin-bottom:0.75rem;padding:0.75rem;border:1px solid #E0DDD8;background:#FAFAF7;">
          <input id="we-title" type="text" style="width:100%;box-sizing:border-box;font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;padding:0.35rem 0.5rem;border:1px solid #C8C5C0;margin-bottom:0.5rem;">
          <textarea id="we-abstract" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:0.9rem;padding:0.4rem 0.5rem;border:1px solid #C8C5C0;min-height:120px;resize:vertical;line-height:1.6;margin-bottom:0.5rem;"></textarea>
          <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
            <button class="form-btn" onclick="saveWorkshopEdit()">Save</button>
            <button onclick="cancelWorkshopEdit()" style="font-family:inherit;font-size:0.85rem;color:#5A5A5A;cursor:pointer;background:none;border:none;padding:0;text-decoration:underline;">Cancel</button>
            <span id="we-msg" style="font-size:0.8rem;color:#8A1F2E;"></span>
          </div>
        </div>
        <div id="proposal-body"></div>
        <div id="comment-section" class="comment-section" style="display:none;">
          <button class="comment-toggle" id="comment-toggle-btn" onclick="toggleComments()">Comments ▾</button>
          <div id="comments-body" style="display:none;">
            <div id="comments-list"></div>
            <div class="comment-compose">
              <textarea class="comment-input" id="comment-input" placeholder="Suggestions for the speaker/organizer…" rows="3"></textarea><br>
              <button class="comment-submit-btn" id="comment-submit-btn" onclick="submitComment()">Post</button>
              <span class="comment-msg" id="comment-msg"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer"></footer>
</div>
<script src="/js/main.js"></script>
<script>
const PROPOSAL_ID = 79;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderInline(s){return s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');}
function fmtDate(d){var dt=new Date(d+'T00:00:00Z');return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});}
function renderText(text){
  if(!text||text.trim()===''||text.trim().toLowerCase()==='n/a') return '';
  return esc(text).split(/\n\n+/).map(block=>{
    const lines=block.split('\n').map(l=>l.trimEnd());
    const nonempty=lines.filter(l=>l.trim());
    if(nonempty.length>1&&nonempty.every(l=>l.trim().startsWith('- ')))
      return '<ul style="line-height:1.8;padding-left:1.4rem;">'+nonempty.map(l=>`<li>${renderInline(l.replace(/^- /,''))}</li>`).join('')+'</ul>';
    return `<p style="line-height:1.7;">${renderInline(block.replace(/\n/g,'<br>'))}</p>`;
  }).join('');
}
const TRACK_LABELS={'SIGPfB':'SIGPfB (Protocols for Business)','SIGFPT':'SIGFPT (Formal Protocol Theory)','MRG':'MRG (Model Roundtable)','ProtFiSIG':'ProtFiSIG (Protocol Fiction)','Alumni':'Alumni Track'};
function renderProposal(p){
  const track=TRACK_LABELS[p.track]||p.track||'';
  const sec=t=>`<h2 class="section-label">${t}</h2>`;
  let html=`<div class="page-header"><h1>${esc(p.title)}</h1></div>
    <p style="font-size:0.82rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#8A8A8A;margin-bottom:1rem;">Workshop${track?' · '+esc(track):''}</p>`;
  const sessions=p.workshop_sessions||[];
  if(sessions.length){
    html+='<ul class="workshop-sessions">'+sessions.map(function(s){
      var note=s.note?' <span class="workshop-session-note">('+esc(s.note)+')</span>':'';
      return '<li>Session '+s.seq+' \u2014 '+fmtDate(s.date)+' \u00b7 '+esc(s.start_time)+'\u2013'+esc(s.end_time)+' UTC'+note+'</li>';
    }).join('')+'</ul>';
  }
  if(p.registration_url){
    html+='<a class="workshop-register-btn" href="'+esc(p.registration_url)+'" target="_blank" rel="noopener noreferrer">Register for this workshop \u2192</a>';
  }
  if(p.abstract)   html+=sec('Abstract')+renderText(p.abstract);
  if(p.audience)   html+=sec('Audience')+renderText(p.audience);
  if(p.takeaways)  html+=sec('What participants will take away')+renderText(p.takeaways);
  if(p.activities) html+=sec('What participants will do')+renderText(p.activities);
  const orgs=[];
  if(p.organizer_name)    orgs.push({name:p.organizer_name,bio:p.organizer_bio});
  if(p.co_organizer_name) orgs.push({name:p.co_organizer_name,bio:p.co_organizer_bio});
  if(p.host3_name) orgs.push({name:p.host3_name,bio:p.host3_bio});
  if(p.host4_name) orgs.push({name:p.host4_name,bio:p.host4_bio});
  if(p.host5_name) orgs.push({name:p.host5_name,bio:p.host5_bio});
  if(orgs.length){
    html+=sec('Organizers');
    html+=orgs.map((o,i)=>`<div class="team-member"${i?' style="margin-top:1.5rem;"':''}>
      <div class="team-bio"><h3 class="team-name">${esc(o.name)}</h3>${renderText(o.bio)}</div></div>`).join('');
  }
  return html;
}
let _proposal=null,_memberEmail='',_isAdmin=false;
Promise.all([
  fetch('/api/members/me').then(r=>r.ok?r.json():{member:null}).catch(()=>({member:null})),
  fetch(`/api/symposium/proposals/${PROPOSAL_ID}`).then(r=>{if(!r.ok)throw new Error();return r.json();}),
])
  .then(([meData,data])=>{
    const member=meData.member||null;
    _memberEmail=member?(member.email||'').toLowerCase():'';
    _isAdmin=!!(member&&member.is_admin);
    _proposal=data.proposal;
    document.getElementById('proposal-body').innerHTML=renderProposal(_proposal);
    document.getElementById('main-view').style.display='';
    document.getElementById('comment-section').style.display='';
    const ownerEmail=(_proposal.organizer_email||_proposal.speaker_email||'').toLowerCase();
    const isOwner=!_isAdmin&&_memberEmail&&_memberEmail===ownerEmail;
    const bar=document.getElementById('workshop-edit-bar');
    if(_isAdmin){
      bar.innerHTML='<a class="edit-own-btn" href="/events/protocol-symposium-2026/program/edit-proposal.html?id='+PROPOSAL_ID+'" style="text-decoration:none;display:inline-block;">Edit details</a>';
      bar.style.display='';
    }else if(isOwner){
      bar.innerHTML='<button class="edit-own-btn" onclick="startWorkshopEdit()">Edit details</button>';
      bar.style.display='';
    }
  })
  .catch(()=>{document.getElementById('gate-view').style.display='';});
function startWorkshopEdit(){
  document.getElementById('we-title').value=_proposal.title||'';
  document.getElementById('we-abstract').value=_proposal.abstract||'';
  document.getElementById('workshop-edit-bar').style.display='none';
  document.getElementById('workshop-edit-form').style.display='';
}
function cancelWorkshopEdit(){
  document.getElementById('workshop-edit-form').style.display='none';
  document.getElementById('workshop-edit-bar').style.display='';
  document.getElementById('we-msg').textContent='';
}
async function saveWorkshopEdit(){
  const title=document.getElementById('we-title').value.trim();
  const abstract=document.getElementById('we-abstract').value.trim();
  const msg=document.getElementById('we-msg');
  if(!title){msg.textContent='Title required.';return;}
  try{
    const res=await fetch('/api/symposium/proposals/'+PROPOSAL_ID,{
      method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,abstract}),
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Failed');
    _proposal={..._proposal,title,abstract};
    document.getElementById('proposal-body').innerHTML=renderProposal(_proposal);
    cancelWorkshopEdit();
  }catch(e){msg.textContent=e.message;}
}
let commentsLoaded=false;
function toggleComments(){
  const body=document.getElementById('comments-body');
  const btn=document.getElementById('comment-toggle-btn');
  const isOpen=body.style.display!=='none';
  if(isOpen){body.style.display='none';btn.textContent=btn.textContent.replace('▴','▾');}
  else{body.style.display='';btn.textContent=btn.textContent.replace('▾','▴');if(!commentsLoaded)loadComments();}
}
async function loadComments(){
  const list=document.getElementById('comments-list');
  list.innerHTML='<p style="color:#8A8A8A;font-size:0.82rem;font-style:italic;">Loading…</p>';
  try{
    const res=await fetch(`/api/symposium/comments?proposal_id=${PROPOSAL_ID}`);
    const data=await res.json();
    const comments=data.comments||[];
    commentsLoaded=true;
    const btn=document.getElementById('comment-toggle-btn');
    const open=document.getElementById('comments-body').style.display!=='none';
    btn.textContent=`Comments (${comments.length}) ${open?'▴':'▾'}`;
    if(!comments.length){
      list.innerHTML='<p style="color:#8A8A8A;font-size:0.82rem;font-style:italic;margin-bottom:0.5rem;">No comments yet.</p>';
    }else{
      list.innerHTML=comments.map(c=>`<div class="comment-item">
        <div class="comment-author">${esc(c.member_name)} · ${c.created_at.slice(0,10)}</div>
        <div class="comment-text">${esc(c.body)}</div>
      </div>`).join('');
    }
  }catch{list.innerHTML='<p style="color:#8A1F2E;font-size:0.82rem;">Failed to load comments.</p>';}
}
async function submitComment(){
  const input=document.getElementById('comment-input');
  const msg=document.getElementById('comment-msg');
  const btn=document.getElementById('comment-submit-btn');
  const text=input.value.trim();
  if(!text)return;
  btn.disabled=true;
  try{
    const res=await fetch('/api/symposium/comments',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({proposal_id:PROPOSAL_ID,body:text}),
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Failed');
    input.value='';
    msg.textContent='Posted.';msg.style.color='#2A6B6B';
    setTimeout(()=>{msg.textContent='';},3000);
    commentsLoaded=false;loadComments();
  }catch(e){msg.textContent=e.message;msg.style.color='#8A1F2E';}
  btn.disabled=false;
}
</script>
</body>
</html>
