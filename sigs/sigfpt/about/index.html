<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Formal Protocol Theory</title>
  <meta name="description" content="About SIGFPT — mathematical and logical modeling of protocols.">
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    #page-body h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.4rem; font-weight: 600; margin: 2rem 0 0.6rem; color: #1A1A1A; }
    #page-body h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.4rem; }
    #page-body p  { margin-bottom: 1rem; line-height: 1.75; }
    #page-body ul, #page-body ol { padding-left: 1.4rem; margin: 0.5rem 0 1rem; }
    #page-body li { margin-bottom: 0.35rem; line-height: 1.65; }
    #page-body a  { color: #2A6B6B; }
    #page-body a:hover { text-decoration: underline; }
    #page-body img { max-width: 100%; border-radius: 3px; margin: 1.25rem 0; display: block; }
    #page-body blockquote { border-left: 3px solid #2A6B6B; margin: 1.25rem 0; padding: 0.5rem 0 0.5rem 1rem; color: #5A5A5A; font-style: italic; }
    #page-body hr { border: none; border-top: 1px solid #E0DDD8; margin: 2rem 0; }
    #page-body code { font-family: monospace; font-size: 0.88em; background: #F0EDE8; padding: 0.1em 0.35em; border-radius: 2px; }
    .edit-bar { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid #E0DDD8; }
    .editor-actions { display: flex; gap: 0.75rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #E0DDD8; }
    .toastui-editor-defaultUI { border-color: #D8D5CF !important; border-radius: 4px !important; }
    .toastui-editor-toolbar { background: #FAFAF7 !important; border-bottom-color: #E0DDD8 !important; }
  </style>
</head>
<body>
<div class="interior-wrapper">
  <header id="site-header"></header>
  <main class="interior-main">
    <div class="container">

      <div id="page-loading" style="color:#8A8A8A;padding:2rem 0;">Loading…</div>

      <div id="page-content" style="display:none;">
        <div class="page-header">
          <h1>Formal Protocol Theory</h1>
          <p style="margin-top:0.4rem;font-size:0.85rem;">
            <a href="/sigs/sigfpt/" class="back-link">&#8592; SIGFPT sessions</a>
          </p>
        </div>
        <div id="page-body" class="about-body"></div>
        <div id="edit-bar" class="edit-bar" style="display:none;">
          <button class="form-btn form-btn--secondary" id="edit-btn">Edit page</button>
        </div>
      </div>

      <div id="page-editor" style="display:none;">
        <div class="page-header"><h1>Editing — Formal Protocol Theory</h1></div>
        <div id="editor-mount"></div>
        <div class="editor-actions">
          <button class="form-btn" id="save-btn">Save</button>
          <button class="form-btn form-btn--secondary" id="cancel-btn">Cancel</button>
        </div>
      </div>

    </div>
  </main>
  <footer class="site-footer"></footer>
</div>
<script src="/js/main.js"></script>
<script>var PAGE_KEY = 'sigs/sigfpt/about';</script>
<script src="/js/managed-page.js"></script>
</body>
</html>
