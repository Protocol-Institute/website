<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Ergonomics for AI — Protocol Institute</title>
  <meta name="description" content="An inventory of good and bad cognitive ergonomic habits for AI use.">
  <link rel="icon" href="https://protocol-institute.org/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="interior-wrapper">

  <header id="site-header"></header>

  <main class="interior-main">
    <div class="container">

      <div class="page-header">
        <h1>Habit Inventory</h1>
      </div>

      <p class="projects-intro">An open index of cognitive ergonomic patterns for AI use — good habits that sharpen thinking, bad habits that blunt it. Contributed by Protocol Institute members.</p>

      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">Type</span>
          <div class="type-toggle">
            <button data-type="all" class="active">All</button>
            <button data-type="good">Good</button>
            <button data-type="bad">Bad</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Severity range</span>
          <div class="sev-range">
            <input type="number" id="sev-min" min="-10" max="10" value="-10">
            <span style="color:#ABABAB">to</span>
            <input type="number" id="sev-max" min="-10" max="10" value="10">
            <label style="font-size:0.78rem;color:#ABABAB;display:flex;align-items:center;gap:0.25rem;cursor:pointer;">
              <input type="checkbox" id="sev-filter-active"> filter
            </label>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Sort</span>
          <select class="sort-select" id="sort-select">
            <option value="alpha">A – Z</option>
            <option value="do">Most "I do this"</option>
            <option value="dont">Most "I don't do this"</option>
            <option value="comments">Most discussed</option>
            <option value="severity">Severity (abs)</option>
          </select>
        </div>
        <span class="filter-count" id="filter-count"></span>
      </div>

      <div id="items-container">
        <p class="loading-state">Loading…</p>
      </div>

    </div>
  </main>

  <footer class="site-footer"></footer>

</div>

<script src="/js/nav.js"></script>
<script>
(function () {
  var allItems = [], sevFilterActive = false, sevMin = -10, sevMax = 10;
  var filterType = 'all', sortMode = 'alpha';

  function escHtml(s) {
    return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
  }

  function severityColor(s) {
    if (s === null || s === undefined) return null;
    var t = (s + 10) / 20, r, g;
    if (t <= 0.5) { r = 210; g = Math.round(20 + t * 2 * 190); }
    else { r = Math.round(210 * (1 - (t - 0.5) * 2)); g = 210; }
    return 'rgb(' + r + ',' + g + ',0)';
  }

  function severityTextColor(s) {
    if (s === null || s === undefined) return '#888';
    return (s >= -2 && s <= 2) ? '#333' : '#fff';
  }

  function renderItems() {
    var items = allItems.slice();
    if (filterType !== 'all') items = items.filter(function(i){ return i.type === filterType; });
    if (sevFilterActive) items = items.filter(function(i){ return i.severity !== null && i.severity !== undefined && i.severity >= sevMin && i.severity <= sevMax; });

    if (sortMode === 'alpha')    items.sort(function(a,b){ return a.title.localeCompare(b.title); });
    if (sortMode === 'do')       items.sort(function(a,b){ return (b.do_count||0)-(a.do_count||0); });
    if (sortMode === 'dont')     items.sort(function(a,b){ return (b.dont_count||0)-(a.dont_count||0); });
    if (sortMode === 'comments') items.sort(function(a,b){ return (b.comment_count||0)-(a.comment_count||0); });
    if (sortMode === 'severity') items.sort(function(a,b){ return Math.abs(b.severity||0)-Math.abs(a.severity||0); });

    document.getElementById('filter-count').textContent = items.length + (items.length === 1 ? ' entry' : ' entries');

    if (!items.length) {
      document.getElementById('items-container').innerHTML = '<p class="empty-state">No entries match the current filters.</p>';
      return;
    }

    var html = '<ul class="item-list" role="list">' + items.map(function(item) {
      var bg  = severityColor(item.severity);
      var tc  = severityTextColor(item.severity);
      var borderColor = bg || '#C8C4BE';
      var chipHtml = bg
        ? '<span class="sev-chip" style="background:' + bg + ';color:' + tc + '" title="Severity ' + item.severity + '">' + (item.severity > 0 ? '+' : '') + item.severity + '</span>'
        : '<span class="sev-chip sev-chip--unset" title="Severity unset">?</span>';
      var tags = (item.tags || []).map(function(t){ return '<span class="tag-chip">' + escHtml(t) + '</span>'; }).join('');
      var doClass   = item.my_vote === 'do'   ? ' voted-do'   : '';
      var dontClass = item.my_vote === 'dont' ? ' voted-dont' : '';
      var excerpt = item.symptoms ? item.symptoms.slice(0,200) + (item.symptoms.length > 200 ? '…' : '') : '';

      return '<li class="item-card" style="border-left-color:' + borderColor + '" data-slug="' + escHtml(item.slug) + '">' +
        '<div class="item-card-top">' +
          '<span class="habit-type-badge habit-type-badge--' + item.type + '">' + (item.type === 'good' ? 'Good habit' : 'Bad habit') + '</span>' +
          '<span class="item-title"><a href="/item?slug=' + encodeURIComponent(item.slug) + '">' + escHtml(item.title) + '</a></span>' +
          chipHtml +
        '</div>' +
        (excerpt ? '<p class="item-symptoms">' + escHtml(excerpt) + '</p>' : '') +
        (tags ? '<div class="item-tags">' + tags + '</div>' : '') +
        '<div class="item-footer">' +
          '<button class="vote-btn' + doClass + '" data-slug="' + escHtml(item.slug) + '" data-vote="do">✓ I do this <span class="vote-count">' + (item.do_count||0) + '</span></button>' +
          '<button class="vote-btn' + dontClass + '" data-slug="' + escHtml(item.slug) + '" data-vote="dont">✗ I don\'t <span class="vote-count">' + (item.dont_count||0) + '</span></button>' +
          '<span class="comment-count"><a href="/item?slug=' + encodeURIComponent(item.slug) + '#comments">💬 ' + (item.comment_count||0) + '</a></span>' +
        '</div>' +
      '</li>';
    }).join('') + '</ul>';

    document.getElementById('items-container').innerHTML = html;
    bindVoteButtons();
  }

  function bindVoteButtons() {
    document.querySelectorAll('.vote-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var slug = btn.dataset.slug, vote = btn.dataset.vote;
        fetch('/api/items/' + encodeURIComponent(slug) + '/vote', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({vote: vote})
        }).then(function(res) {
          if (res.status === 401) { window.location.href = 'https://protocol-institute.org/members/join?return=' + encodeURIComponent(window.location.href); return; }
          if (!res.ok) return;
          return res.json();
        }).then(function(data) {
          if (!data) return;
          var item = allItems.find(function(i){ return i.slug === slug; });
          if (item) { item.do_count = data.do_count; item.dont_count = data.dont_count; item.my_vote = data.my_vote; }
          renderItems();
        }).catch(function(){});
      });
    });
  }

  fetch('/api/items')
    .then(function(r){ return r.json(); })
    .then(function(data){ allItems = data.items || []; renderItems(); })
    .catch(function(){ document.getElementById('items-container').innerHTML = '<p class="empty-state">Could not load entries.</p>'; });

  document.querySelectorAll('.type-toggle button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      filterType = btn.dataset.type;
      document.querySelectorAll('.type-toggle button').forEach(function(b){ b.className = ''; });
      btn.className = filterType === 'all' ? 'active' : (filterType === 'good' ? 'active-good' : 'active-bad');
      renderItems();
    });
  });

  document.getElementById('sort-select').addEventListener('change', function(e){ sortMode = e.target.value; renderItems(); });

  document.getElementById('sev-filter-active').addEventListener('change', function(e){ sevFilterActive = e.target.checked; renderItems(); });

  ['sev-min','sev-max'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      sevMin = parseInt(document.getElementById('sev-min').value, 10) || -10;
      sevMax = parseInt(document.getElementById('sev-max').value, 10) || 10;
      if (sevFilterActive) renderItems();
    });
  });
}());
</script>
</body>
</html>
