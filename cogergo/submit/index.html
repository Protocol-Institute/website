<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Entry — Cognitive Ergonomics for AI</title>
  <link rel="icon" href="https://protocol-institute.org/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="interior-wrapper">

  <header id="site-header"></header>

  <main class="interior-main">
    <div class="container">

      <div class="page-header">
        <h1>Submit an Entry</h1>
      </div>

      <div id="auth-gate" class="auth-gate" style="display:none">
        <p style="margin-bottom:1.25rem;max-width:48ch;">You must be a Protocol Institute member to submit a habit entry.</p>
        <a id="login-link" href="https://protocol-institute.org/members/join?return=https://cogergo.protocol-institute.org/submit" class="form-btn">Log in to continue</a>
      </div>

      <div id="submit-form-area" style="display:none;max-width:580px;">
        <p class="projects-intro">Submissions are reviewed by admins before appearing in the index.</p>

        <form id="submit-form">
          <div class="form-group">
            <label class="form-label" for="f-title">Title *</label>
            <input class="form-input" type="text" id="f-title" maxlength="200" required placeholder="e.g. Context window neglect">
          </div>

          <div class="form-group">
            <label class="form-label">Type *</label>
            <div style="display:flex;gap:1.5rem;margin-top:0.25rem;">
              <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;font-size:0.95rem;">
                <input type="radio" name="type" value="good" required> Good habit
              </label>
              <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;font-size:0.95rem;">
                <input type="radio" name="type" value="bad"> Bad habit
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="f-symptoms">Visible symptoms *</label>
            <textarea class="form-textarea" id="f-symptoms" rows="3" maxlength="1500" required placeholder="How does this habit show up in practice?"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="f-prognosis">Prognosis *</label>
            <textarea class="form-textarea" id="f-prognosis" rows="3" maxlength="1500" required placeholder="What happens if this habit continues unchecked?"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="f-improvement">Improvement ideas *</label>
            <textarea class="form-textarea" id="f-improvement" rows="3" maxlength="1500" required placeholder="Practical suggestions for improvement or mitigation…"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="f-tags">Tags <span style="font-weight:300;color:#8A8A8A;">(optional)</span></label>
            <input class="form-input" type="text" id="f-tags" placeholder="attention, context, prompting">
            <p class="form-hint">Comma-separated keywords.</p>
          </div>

          <div style="display:flex;gap:0.75rem;align-items:center;margin-top:0.5rem;">
            <button type="submit" class="form-btn" id="submit-btn">Submit for review</button>
          </div>
          <div id="form-msg" class="form-msg" style="display:none;"></div>
        </form>
      </div>

    </div>
  </main>

  <footer class="site-footer"></footer>

</div>

<script src="/js/nav.js"></script>
<script>
(function () {
  fetch('/api/me')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data || !data.member) { document.getElementById('auth-gate').style.display = ''; }
      else { document.getElementById('submit-form-area').style.display = ''; }
    })
    .catch(function(){ document.getElementById('auth-gate').style.display = ''; });

  document.getElementById('submit-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var msg = document.getElementById('form-msg');
    btn.disabled = true; btn.textContent = 'Submitting…';
    msg.style.display = 'none';

    var typeEl = document.querySelector('input[name="type"]:checked');
    var body = {
      title:             document.getElementById('f-title').value.trim(),
      type:              typeEl ? typeEl.value : '',
      symptoms:          document.getElementById('f-symptoms').value.trim(),
      prognosis:         document.getElementById('f-prognosis').value.trim(),
      improvement_ideas: document.getElementById('f-improvement').value.trim(),
      tags:              document.getElementById('f-tags').value.trim(),
    };

    fetch('/api/items', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
      .then(function(res){ return res.json().then(function(d){ return {ok:res.ok, data:d}; }); })
      .then(function(r) {
        if (r.ok) {
          msg.className = 'form-msg form-msg--success';
          msg.textContent = 'Submitted — it will appear once approved by an admin.';
          msg.style.display = '';
          document.getElementById('submit-form').reset();
        } else {
          msg.className = 'form-msg form-msg--error';
          msg.textContent = r.data.error || 'Submission failed.';
          msg.style.display = '';
          btn.disabled = false; btn.textContent = 'Submit for review';
        }
      })
      .catch(function() {
        msg.className = 'form-msg form-msg--error';
        msg.textContent = 'Network error. Please try again.';
        msg.style.display = '';
        btn.disabled = false; btn.textContent = 'Submit for review';
      });
  });
}());
</script>
</body>
</html>
