<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Cognitive Ergonomics for AI</title>
  <link rel="icon" href="https://protocol-institute.org/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="interior-wrapper">

  <header id="site-header"></header>

  <main class="interior-main">
    <div class="container">

      <div class="page-header">
        <h1>Admin</h1>
      </div>

      <div id="auth-gate" style="display:none">
        <p style="color:#5A5A5A;margin-bottom:1.25rem;">Admin access requires a Protocol Institute admin account.</p>
        <a href="https://protocol-institute.org/members/join?return=https://cogergo.protocol-institute.org/admin" class="form-btn">Log in</a>
      </div>

      <div id="admin-panel" style="display:none">
        <div class="admin-tab-bar">
          <button class="admin-tab active" data-status="pending">Pending</button>
          <button class="admin-tab" data-status="approved">Approved</button>
          <button class="admin-tab" data-status="rejected">Rejected</button>
        </div>
        <div id="admin-list"><p class="loading-state">Loading…</p></div>
      </div>

    </div>
  </main>

  <footer class="site-footer"></footer>

</div>

<script src="/js/nav.js"></script>
<script>
(function () {
  var currentStatus = 'pending';

  function escHtml(s) {
    return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
  }

  function severityColor(s) {
    if (s === null || s === undefined) return null;
    var t = (s + 10) / 20, r, g;
    if (t <= 0.5) { r = 210; g = Math.round(20 + t * 2 * 190); }
    else { r = Math.round(210 * (1 - (t - 0.5) * 2)); g = 210; }
    return 'rgb(' + r + ',' + g + ',0)';
  }

  fetch('/api/me')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data || !data.member || !data.member.is_admin) {
        document.getElementById('auth-gate').style.display = '';
        return;
      }
      document.getElementById('admin-panel').style.display = '';
      loadItems('pending');
    })
    .catch(function(){ document.getElementById('auth-gate').style.display = ''; });

  function loadItems(status) {
    currentStatus = status;
    document.querySelectorAll('.admin-tab').forEach(function(btn){
      btn.className = 'admin-tab' + (btn.dataset.status === status ? ' active' : '');
    });
    document.getElementById('admin-list').innerHTML = '<p class="loading-state">Loading…</p>';
    fetch('/api/admin/items?status=' + status)
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(data){ renderItems(data.items || [], status); })
      .catch(function(){ document.getElementById('admin-list').innerHTML = '<p class="empty-state">Error loading items.</p>'; });
  }

  function renderItems(items, status) {
    var list = document.getElementById('admin-list');
    if (!items.length) { list.innerHTML = '<p class="empty-state">No ' + status + ' items.</p>'; return; }

    list.innerHTML = items.map(function(item) {
      var sevColor = severityColor(item.severity);
      return '<div class="admin-item-card is-' + item.type + '" id="ai-' + CSS.escape(item.slug) + '">' +
        '<div class="admin-item-title">' + escHtml(item.title) + '</div>' +
        '<div class="admin-field"><strong>Type:</strong> ' + (item.type === 'good' ? '✓ Good habit' : '✗ Bad habit') + '</div>' +
        '<div class="admin-field"><strong>By:</strong> ' + escHtml(item.contributor_name || item.contributed_by_slug) + '</div>' +
        (item.symptoms ? '<div class="admin-field"><strong>Symptoms:</strong> ' + escHtml(item.symptoms.slice(0,200)) + (item.symptoms.length>200?'…':'') + '</div>' : '') +
        (item.prognosis ? '<div class="admin-field"><strong>Prognosis:</strong> ' + escHtml(item.prognosis.slice(0,200)) + (item.prognosis.length>200?'…':'') + '</div>' : '') +
        ((item.tags||[]).length ? '<div class="admin-field"><strong>Tags:</strong> ' + item.tags.map(function(t){return escHtml(t);}).join(', ') + '</div>' : '') +
        '<div class="admin-field"><strong>Votes:</strong> ✓ ' + (item.do_count||0) + ' &nbsp; ✗ ' + (item.dont_count||0) + '</div>' +
        '<div class="admin-field" style="display:flex;align-items:center;gap:0.5rem;">' +
          '<strong>Severity:</strong>' +
          '<input type="number" class="admin-sev-input sev-field" min="-10" max="10" value="' + (item.severity !== null && item.severity !== undefined ? item.severity : '') + '" placeholder="–" data-slug="' + escHtml(item.slug) + '">' +
          (sevColor ? '<span style="width:12px;height:12px;border-radius:50%;background:' + sevColor + ';display:inline-block;"></span> <span style="font-size:0.82rem;color:#5A5A5A">' + item.severity + '</span>' : '<span style="font-size:0.82rem;color:#ABABAB">unset</span>') +
        '</div>' +
        '<input type="text" class="admin-notes-input notes-field" placeholder="Admin notes (optional)" data-slug="' + escHtml(item.slug) + '">' +
        '<div class="admin-actions">' +
          (status === 'pending'
            ? '<button class="form-btn approve-btn" data-slug="' + escHtml(item.slug) + '">Approve</button>' +
              '<button class="form-btn form-btn--secondary reject-btn" data-slug="' + escHtml(item.slug) + '">Reject</button>'
            : '<button class="form-btn sev-btn" data-slug="' + escHtml(item.slug) + '">Save severity</button>') +
          '<a href="/item?slug=' + encodeURIComponent(item.slug) + '" class="form-btn form-btn--secondary" target="_blank" style="font-size:0.82rem;padding:0.5em 1em;">View ↗</a>' +
          '<span class="admin-msg" id="amsg-' + CSS.escape(item.slug) + '"></span>' +
        '</div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('.approve-btn').forEach(function(btn){ btn.addEventListener('click', function(){ doAction(btn.dataset.slug,'approve'); }); });
    list.querySelectorAll('.reject-btn').forEach(function(btn){  btn.addEventListener('click', function(){ doAction(btn.dataset.slug,'reject'); }); });
    list.querySelectorAll('.sev-btn').forEach(function(btn){     btn.addEventListener('click', function(){ doAction(btn.dataset.slug,'set_severity'); }); });
  }

  function doAction(slug, action) {
    var sevInput   = document.querySelector('.sev-field[data-slug="' + CSS.escape(slug) + '"]');
    var notesInput = document.querySelector('.notes-field[data-slug="' + CSS.escape(slug) + '"]');
    var msg        = document.getElementById('amsg-' + CSS.escape(slug));
    var card       = document.getElementById('ai-' + CSS.escape(slug));

    var body = {slug: slug, action: action};
    if (notesInput && notesInput.value.trim()) body.admin_notes = notesInput.value.trim();
    if (sevInput && sevInput.value.trim() !== '') { var s = parseInt(sevInput.value, 10); if (!isNaN(s)) body.severity = s; }

    fetch('/api/admin/items', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
      .then(function(r) {
        if (r.ok) {
          if (action === 'set_severity') {
            msg.style.color = '#1A6B3C'; msg.textContent = 'Severity saved.';
          } else {
            var label = action === 'approve' ? 'Approved' : 'Rejected';
            var viewLink = action === 'approve' ? ' — <a href="/item?slug=' + encodeURIComponent(slug) + '" target="_blank" style="color:#2A6B6B">View entry ↗</a>' : '';
            card.style.transition = 'opacity 0.3s';
            card.innerHTML = '<div style="padding:0.25rem 0;font-size:0.9rem;color:#1A6B3C;font-weight:500;">' + label + '.' + viewLink + '</div>';
            setTimeout(function() {
              card.style.opacity = '0';
              setTimeout(function() {
                card.remove();
                if (!document.querySelectorAll('.admin-item-card').length) {
                  document.getElementById('admin-list').innerHTML = '<p class="empty-state">No ' + currentStatus + ' items.</p>';
                }
              }, 300);
            }, 1500);
          }
        } else {
          msg.style.color = '#8B1A1A'; msg.textContent = r.data.error || 'Error.';
        }
      })
      .catch(function(){ msg.style.color = '#8B1A1A'; msg.textContent = 'Network error.'; });
  }

  document.querySelectorAll('.admin-tab').forEach(function(btn){
    btn.addEventListener('click', function(){ loadItems(btn.dataset.status); });
  });
}());
</script>
</body>
</html>
