<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Ergonomics for AI — Protocol Institute</title>
  <link rel="icon" href="https://protocol-institute.org/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="interior-wrapper">

  <header id="site-header"></header>

  <main class="interior-main">
    <div class="container">

      <div id="item-loading"><p class="loading-state">Loading…</p></div>

      <div id="item-content" style="display:none">

        <div class="item-detail-header">
          <p class="detail-breadcrumb"><a href="/">← Habit inventory</a></p>
          <div id="admin-sev-bar" class="admin-sev-row" style="display:none">
            <label>Admin — Severity:</label>
            <input type="number" id="admin-sev-input" min="-10" max="10" placeholder="–">
            <button class="form-btn" id="admin-sev-btn" style="padding:0.35em 0.9em;font-size:0.82rem;">Set</button>
            <span id="admin-sev-msg" style="font-size:0.82rem;"></span>
          </div>
          <div class="detail-title-row">
            <h1 class="detail-title" id="d-title"></h1>
            <div class="sev-chip sev-chip--large sev-chip--unset" id="d-sev-chip"></div>
          </div>
          <div class="detail-meta-row" id="d-meta-row"></div>
        </div>

        <div class="clinical-sections" id="d-clinical"></div>

        <div class="detail-vote-row" id="d-vote-row"></div>

        <div class="comments-section" id="comments">
          <h2 class="comments-heading">Discussion</h2>
          <div id="comments-list"></div>
          <div id="comment-form-area"></div>
        </div>

      </div>

      <div id="item-error" style="display:none">
        <p class="empty-state">Entry not found. <a href="/">Back to inventory</a></p>
      </div>

    </div>
  </main>

  <footer class="site-footer"></footer>

</div>

<script src="/js/nav.js"></script>
<script>
(function () {
  function escHtml(s) {
    return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
  }

  function severityColor(s) {
    if (s === null || s === undefined) return null;
    var t = (s + 10) / 20, r, g;
    if (t <= 0.5) { r = 210; g = Math.round(20 + t * 2 * 190); }
    else { r = Math.round(210 * (1 - (t - 0.5) * 2)); g = 210; }
    return 'rgb(' + r + ',' + g + ',0)';
  }

  function severityTextColor(s) {
    if (s === null || s === undefined) return '#888';
    return (s >= -2 && s <= 2) ? '#333' : '#fff';
  }

  function fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso + (iso.endsWith('Z') ? '' : 'Z')).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
  }

  var slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) { window.location.replace('/'); return; }

  var currentDoCount = 0, currentDontCount = 0;

  fetch('/api/items/' + encodeURIComponent(slug))
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(data) {
      var item = data.item, comments = data.comments || [];
      currentDoCount   = item.do_count   || 0;
      currentDontCount = item.dont_count || 0;

      document.title = item.title + ' — Cognitive Ergonomics for AI';

      var bg = severityColor(item.severity);
      var tc = severityTextColor(item.severity);
      document.getElementById('d-title').textContent = item.title;

      var chip = document.getElementById('d-sev-chip');
      if (bg) {
        chip.style.background = bg; chip.style.color = tc;
        chip.textContent = (item.severity > 0 ? '+' : '') + item.severity;
        chip.title = 'Severity ' + item.severity;
        chip.className = 'sev-chip sev-chip--large';
      } else {
        chip.title = 'Severity unset';
      }

      document.getElementById('d-meta-row').innerHTML =
        '<span class="habit-type-badge habit-type-badge--' + item.type + '">' + (item.type === 'good' ? 'Good habit' : 'Bad habit') + '</span>' +
        (item.tags && item.tags.length ? '<span class="item-tags" style="display:inline-flex;gap:0.35rem;flex-wrap:wrap;">' + item.tags.map(function(t){return '<span class="tag-chip">'+escHtml(t)+'</span>';}).join('') + '</span>' : '') +
        '<span class="contributor-line" style="margin-left:auto;">Contributed by ' + escHtml(item.contributor_name || item.contributed_by_slug) + '</span>';

      // Clinical sections
      var sections = [
        {key: 'symptoms', label: 'Visible symptoms', val: item.symptoms},
        {key: 'prognosis', label: 'Prognosis', val: item.prognosis},
        {key: 'improvement_ideas', label: 'Improvement ideas', val: item.improvement_ideas},
      ];
      var clinHtml = sections.filter(function(s){return s.val;}).map(function(s){
        return '<div class="clinical-section">' +
          '<span class="clinical-label">' + s.label + '</span>' +
          '<div class="clinical-body">' + escHtml(s.val) + '</div>' +
        '</div>';
      }).join('');
      document.getElementById('d-clinical').innerHTML = clinHtml;

      // Admin severity
      if (item.is_admin) {
        var bar = document.getElementById('admin-sev-bar');
        bar.style.display = 'flex';
        document.getElementById('admin-sev-input').value = item.severity !== null && item.severity !== undefined ? item.severity : '';
        document.getElementById('admin-sev-btn').addEventListener('click', function() {
          var val = document.getElementById('admin-sev-input').value.trim();
          var body = val === '' ? {slug: slug, action: 'set_severity', severity: null}
                                : {slug: slug, action: 'set_severity', severity: parseInt(val, 10)};
          fetch('/api/admin/items', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
            .then(function(r){ return r.json(); })
            .then(function(d) {
              var msg = document.getElementById('admin-sev-msg');
              msg.textContent = d.ok ? 'Saved.' : (d.error || 'Error.');
              msg.style.color = d.ok ? '#1A6B3C' : '#8B1A1A';
              if (d.ok) {
                var newSev = val === '' ? null : parseInt(val, 10);
                var newBg = severityColor(newSev);
                var newTc = severityTextColor(newSev);
                if (newBg) { chip.style.background = newBg; chip.style.color = newTc; chip.textContent = (newSev > 0 ? '+' : '') + newSev; chip.className = 'sev-chip sev-chip--large'; }
                else { chip.className = 'sev-chip sev-chip--large sev-chip--unset'; chip.textContent = '?'; }
              }
            });
        });
      }

      renderVoteRow(item.my_vote);
      renderComments(comments, item.my_vote !== undefined);

      document.getElementById('item-loading').style.display = 'none';
      document.getElementById('item-content').style.display = '';
    })
    .catch(function() {
      document.getElementById('item-loading').style.display = 'none';
      document.getElementById('item-error').style.display = '';
    });

  function renderVoteRow(myVote) {
    var row = document.getElementById('d-vote-row');
    row.innerHTML =
      '<button class="vote-btn' + (myVote === 'do'   ? ' voted-do'   : '') + '" id="vote-do">✓ I do this <span class="vote-count">' + currentDoCount + '</span></button>' +
      '<button class="vote-btn' + (myVote === 'dont' ? ' voted-dont' : '') + '" id="vote-dont">✗ I don\'t do this <span class="vote-count">' + currentDontCount + '</span></button>';
    ['do','dont'].forEach(function(v) {
      document.getElementById('vote-' + v).addEventListener('click', function() {
        fetch('/api/items/' + encodeURIComponent(slug) + '/vote', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({vote: v})
        }).then(function(res){
          if (res.status === 401) { window.location.href = 'https://protocol-institute.org/members/join?return=' + encodeURIComponent(window.location.href); return; }
          return res.ok ? res.json() : null;
        }).then(function(d){
          if (!d) return;
          currentDoCount = d.do_count; currentDontCount = d.dont_count;
          renderVoteRow(d.my_vote);
        }).catch(function(){});
      });
    });
  }

  function renderComments(comments, isAuthed) {
    var list = document.getElementById('comments-list');
    list.innerHTML = !comments.length
      ? '<p class="no-comments">No comments yet.</p>'
      : comments.map(function(c) {
          return '<div class="comment-item">' +
            '<div class="comment-author"><a href="https://protocol-institute.org/members/' + escHtml(c.member_slug) + '">' + escHtml(c.member_name) + '</a>' +
            '<span class="comment-date">' + fmtDate(c.created_at) + '</span></div>' +
            '<div class="comment-body">' + escHtml(c.body) + '</div>' +
          '</div>';
        }).join('');

    var area = document.getElementById('comment-form-area');
    if (isAuthed) {
      area.innerHTML =
        '<div class="comment-form">' +
          '<textarea class="comment-textarea" id="comment-body" rows="3" placeholder="Add a comment…" maxlength="2000"></textarea>' +
          '<div style="display:flex;gap:0.6rem;align-items:center;">' +
            '<button class="form-btn" id="post-comment-btn">Post comment</button>' +
            '<span id="comment-msg" style="font-size:0.82rem;"></span>' +
          '</div>' +
        '</div>';
      document.getElementById('post-comment-btn').addEventListener('click', function() {
        var body = document.getElementById('comment-body').value.trim();
        if (!body) return;
        var btn = document.getElementById('post-comment-btn');
        btn.disabled = true;
        fetch('/api/items/' + encodeURIComponent(slug) + '/comments', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({body: body})
        }).then(function(res){
          if (res.ok) {
            fetch('/api/items/' + encodeURIComponent(slug) + '/comments')
              .then(function(r){ return r.json(); })
              .then(function(d){ renderComments(d.comments || [], true); });
          } else {
            document.getElementById('comment-msg').textContent = 'Error posting comment.';
            btn.disabled = false;
          }
        }).catch(function(){ btn.disabled = false; });
      });
    } else {
      area.innerHTML = '<p class="auth-prompt"><a href="https://protocol-institute.org/members/join?return=' + encodeURIComponent(window.location.href) + '">Log in</a> to join the discussion.</p>';
    }
  }
}());
</script>
</body>
</html>
