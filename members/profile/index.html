<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member — The Protocol Institute</title>
  <meta name="description" content="Protocol Institute member profile.">
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="interior-wrapper">

  <header id="site-header"></header>

  <main class="interior-main">
    <div class="container">

      <div id="profile-loading">
        <p style="color:#8A8A8A;font-style:italic;padding:2rem 0;">Loading…</p>
      </div>

      <div id="profile-content" style="display:none;">
        <div class="project-detail-breadcrumb"><a href="/members">← Members</a></div>
        <div class="page-header profile-header">
          <div id="pf-photo"></div>
          <div>
            <h1 id="pf-name"></h1>
            <p class="profile-role" id="pf-role"></p>
          </div>
        </div>

        <p class="profile-bio" id="pf-bio"></p>
        <p class="profile-links" id="pf-links"></p>

        <p class="profile-section-label">Projects</p>
        <ul class="entity-list" id="pf-projects"></ul>
        <div id="pf-ops-section" style="display:none;">
          <p class="profile-section-label">Operations</p>
          <ul class="entity-list" id="pf-ops"></ul>
        </div>
        <p id="pf-add-project" style="display:none;margin-top:1rem;">
          <a href="/projects/submit" class="form-btn form-btn--inline">Add a project →</a>
        </p>
      </div>

      <div id="profile-error" style="display:none;">
        <p style="color:#8A8A8A;font-style:italic;padding:2rem 0;">Member not found. <a href="/members">Back to members</a></p>
      </div>

    </div>
  </main>

  <footer class="site-footer"></footer>

</div>

<script src="/js/main.js"></script>
<script src="/js/research.js"></script>
<script>
(function () {
  const R = window.PI_RESEARCH;
  const esc = R.escHtml;
  const STATE_LABELS = { stub: 'Stub', beta: 'Beta', production: 'Production' };

  const slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) { window.location.replace('/members'); return; }

  function photoSrc(key) {
    if (!key) return null;
    if (key.startsWith('http://') || key.startsWith('https://')) return key;
    return '/assets/' + key;
  }

  Promise.all([
    fetch('/api/members/profile?slug=' + encodeURIComponent(slug)).then(r => r.ok ? r.json() : Promise.reject(r.status)),
    fetch('/api/projects?member=' + encodeURIComponent(slug)).then(r => r.ok ? r.json() : { projects: [] }).catch(() => ({ projects: [] })),
    fetch('/api/members/me').then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([prof, proj, me]) => {
    const m = prof.member;
    document.title = m.name + ' — The Protocol Institute';
    document.getElementById('pf-name').textContent = m.name;

    const src = photoSrc(m.photo_r2_key);
    const initials = String(m.name || '').split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
    document.getElementById('pf-photo').innerHTML = src
      ? `<img class="profile-photo" src="${esc(src)}" alt="">`
      : `<div class="profile-photo">${esc(initials)}</div>`;

    const role = [m.team_title, m.tier === 'community_lead' ? m.community_lead_title : '', m.type === 'ai' ? 'AI' : '', m.city]
      .filter(Boolean).map(esc).join(' · ');
    document.getElementById('pf-role').innerHTML = role;
    document.getElementById('pf-bio').textContent = m.bio || '';

    const links = [];
    if (m.website) links.push(`<a href="${esc(m.website)}" target="_blank" rel="noopener noreferrer">Website →</a>`);
    if (m.discord_handle) links.push('Discord: ' + esc(m.discord_handle));
    document.getElementById('pf-links').innerHTML = links.join(' &nbsp;·&nbsp; ');

    const isMe = !!(me && me.member && me.member.slug === m.slug);
    const all = proj.projects || [];
    const projects = all.filter(p => p.realm !== 'admin');
    const ops = all.filter(p => p.realm === 'admin');
    const card = p => `
          <li class="entity-card">
            <h2 class="entity-title"><a href="/projects/project?slug=${encodeURIComponent(p.slug)}">${esc(p.title)}</a></h2>
            <div class="project-badges">
              <span class="project-state state-${esc(p.state)}">${STATE_LABELS[p.state] || esc(p.state)}</span>
              ${p.lead_slug === m.slug ? '' : '<span class="project-category">Team</span>'}
              ${R.programTagsHtml(p.programs)}
            </div>
            <div class="entity-description">${esc(p.description)}</div>
          </li>`;
    document.getElementById('pf-projects').innerHTML = projects.length
      ? projects.map(card).join('')
      : `<li class="entity-empty">${isMe ? 'You have no projects yet.' : 'No projects yet.'}</li>`;
    if (ops.length) {
      document.getElementById('pf-ops').innerHTML = ops.map(card).join('');
      document.getElementById('pf-ops-section').style.display = '';
    }
    if (isMe) document.getElementById('pf-add-project').style.display = '';

    document.getElementById('profile-loading').style.display = 'none';
    document.getElementById('profile-content').style.display = '';
  }).catch(() => {
    document.getElementById('profile-loading').style.display = 'none';
    document.getElementById('profile-error').style.display = '';
  });
}());
</script>
</body>
</html>
