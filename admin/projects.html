<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Project Submissions</title>
  <link rel="icon" href="/assets/logo-static.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="interior-wrapper">

  <main class="interior-main">
    <div class="container">

      <div class="page-header">
        <h1>Project Submissions</h1>
      </div>

      <p class="admin-note">Admin interface — not linked publicly. Authenticate with your ADMIN_KEY to load pending submissions.</p>

      <div class="admin-key-form" id="auth-form">
        <div class="form-group" style="flex:1;margin-bottom:0;">
          <label class="form-label" for="admin-key-input">Admin key</label>
          <input class="form-input" type="password" id="admin-key-input" placeholder="Enter ADMIN_KEY">
        </div>
        <button class="form-btn" id="auth-btn" style="align-self:flex-end;">Load submissions</button>
      </div>

      <div id="projects-section" style="display:none;">
        <div id="projects-list"></div>
      </div>

    </div>
  </main>

</div>

<script>
(function () {
  let adminKey = '';

  const SIG_LABELS = {
    sigfpt:    'Formal Protocol Theory (SIGFPT)',
    mrg:       'Memory Research Group (MRG)',
    sigpfb:    'Protocols for Business (SIGPfB)',
    protfisig: 'Protocol Fiction (ProtFiSIG)',
    drg:       'Distributed Robotics Group (DRG)',
    sigpsy:    'Psychohistory (SIGPSY)',
  };

  const STATE_LABELS    = { stub: 'Stub', beta: 'Beta', production: 'Production' };
  const TYPE_LABELS     = { 'one-off': 'One-off', versioned: 'Versioned', accretive: 'Accretive' };
  const ARTIFACT_LABELS = { text: 'Text', code: 'Code', website: 'Website', rich_media: 'Rich media', other: 'Other' };

  function escHtml(str) {
    return String(str || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  }

  async function loadProjects() {
    const res = await fetch('/api/admin/projects', {
      headers: { 'Authorization': `Bearer ${adminKey}` },
    });
    if (!res.ok) { alert('Authentication failed or server error.'); return; }
    const data = await res.json();
    renderProjects(data.projects || []);
    document.getElementById('projects-section').style.display = '';
  }

  function renderProjects(projects) {
    const list = document.getElementById('projects-list');
    if (!projects.length) {
      list.innerHTML = '<p style="color:#8A8A8A;font-style:italic;padding:2rem 0;">No pending submissions.</p>';
      return;
    }

    list.innerHTML = projects.map(p => {
      const artifactLabel = p.artifact_type === 'other' && p.artifact_type_other
        ? escHtml(p.artifact_type_other) : (ARTIFACT_LABELS[p.artifact_type] || escHtml(p.artifact_type));

      return `<div class="request-item" id="proj-${escHtml(p.slug)}">
        <div class="request-name">${escHtml(p.title)}</div>
        <div class="request-email">slug: ${escHtml(p.slug)}</div>
        <div class="request-field"><strong>Lead:</strong> <a href="/members/${escHtml(p.lead_slug)}" target="_blank">${escHtml(p.lead_name || p.lead_slug)}</a></div>
        <div class="request-field"><strong>Description:</strong> ${escHtml(p.description)}</div>
        <div class="request-field"><strong>URL:</strong> <a href="${escHtml(p.url)}" target="_blank" rel="noopener noreferrer">${escHtml(p.url)}</a></div>
        <div class="request-field"><strong>State:</strong> ${escHtml(STATE_LABELS[p.state] || p.state)}</div>
        <div class="request-field"><strong>Type:</strong> ${escHtml(TYPE_LABELS[p.type] || p.type)}</div>
        <div class="request-field"><strong>Artifact:</strong> ${artifactLabel}</div>
        <div class="request-field"><strong>SIG:</strong> ${p.sig_slug ? escHtml(SIG_LABELS[p.sig_slug] || p.sig_slug) : 'Independent'}</div>
        <div class="request-field"><strong>Submitted by:</strong> ${escHtml(p.submitted_by)}</div>
        <div class="request-field" style="color:#8A8A8A;font-size:0.82rem;">Submitted: ${escHtml(p.created_at)}</div>
        <div style="margin-top:0.75rem;">
          <label style="font-size:0.78rem;font-weight:500;display:block;margin-bottom:0.3rem;">Admin notes (optional)</label>
          <textarea class="form-textarea notes-input" style="min-height:60px;" data-slug="${escHtml(p.slug)}"></textarea>
        </div>
        <div class="request-actions">
          <button class="form-btn approve-btn" data-slug="${escHtml(p.slug)}">Approve</button>
          <button class="form-btn form-btn--secondary reject-btn" data-slug="${escHtml(p.slug)}">Reject</button>
        </div>
        <div class="form-msg" id="msg-${CSS.escape(p.slug)}" style="display:none;"></div>
      </div>`;
    }).join('');

    document.querySelectorAll('.approve-btn').forEach(btn => {
      btn.addEventListener('click', () => handleAction(btn.dataset.slug, 'approve'));
    });
    document.querySelectorAll('.reject-btn').forEach(btn => {
      btn.addEventListener('click', () => handleAction(btn.dataset.slug, 'reject'));
    });
  }

  async function handleAction(slug, action) {
    const notesInput = document.querySelector(`.notes-input[data-slug="${CSS.escape(slug)}"]`);
    const msg = document.getElementById(`msg-${CSS.escape(slug)}`);

    const body = { slug, action };
    if (notesInput && notesInput.value.trim()) body.admin_notes = notesInput.value.trim();

    const res = await fetch('/api/admin/projects', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${adminKey}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });

    const data = await res.json();
    msg.style.display = '';
    if (res.ok) {
      msg.className = 'form-msg form-msg--success';
      msg.textContent = action === 'approve' ? 'Approved — now visible in /projects.' : 'Rejected.';
      document.getElementById(`proj-${CSS.escape(slug)}`).style.opacity = '0.4';
    } else {
      msg.className = 'form-msg form-msg--error';
      msg.textContent = data.error || 'Error processing request.';
    }
  }

  document.getElementById('auth-btn').addEventListener('click', function () {
    adminKey = document.getElementById('admin-key-input').value.trim();
    if (!adminKey) return;
    loadProjects();
  });

  document.getElementById('admin-key-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('auth-btn').click();
  });
}());
</script>
</body>
</html>
