<svg xmlns="http://www.w3.org/2000/svg" width="500" height="630" viewBox="0 0 500 630">
  <!-- Background -->
  <rect width="500" height="630" fill="#FAFAF7"/>

  <!-- Top accent bar -->
  <rect width="500" height="3" fill="#2A6B6B"/>

  <!-- Large field -->
  <rect x="40" y="55" width="420" height="270" fill="#2A6B6B" opacity="0.06"/>
  <rect x="40" y="55" width="420" height="270" fill="none" stroke="#2A6B6B" stroke-width="1" opacity="0.18"/>

  <!-- Concentric circle mark, centered in field -->
  <circle cx="250" cy="190" r="72" fill="none" stroke="#2A6B6B" stroke-width="1.5" opacity="0.15"/>
  <circle cx="250" cy="190" r="46" fill="none" stroke="#2A6B6B" stroke-width="1"   opacity="0.20"/>
  <circle cx="250" cy="190" r="24" fill="#2A6B6B" opacity="0.14"/>
  <text x="250" y="196" text-anchor="middle" fill="#2A6B6B"
        font-family="Georgia, serif" font-size="16" font-weight="bold" opacity="0.28">PI</text>

  <!-- Label below field -->
  <text x="40" y="358" fill="#2A6B6B"
        font-family="Georgia, serif" font-size="13" letter-spacing="3.5" opacity="0.38">PROTOCOLIZED</text>

  <!-- Divider line -->
  <line x1="40" y1="372" x2="460" y2="372" stroke="#2A6B6B" stroke-width="0.75" opacity="0.22"/>

  <!-- Simulated text lines — block 1 -->
  <g fill="#2A6B6B">
    <rect x="40" y="388" width="420" height="9"  rx="2" opacity="0.13"/>
    <rect x="40" y="406" width="380" height="8"  rx="2" opacity="0.10"/>
    <rect x="40" y="423" width="400" height="8"  rx="2" opacity="0.10"/>
    <rect x="40" y="440" width="290" height="8"  rx="2" opacity="0.08"/>
  </g>

  <!-- Simulated text lines — block 2 -->
  <g fill="#2A6B6B">
    <rect x="40" y="468" width="420" height="7"  rx="2" opacity="0.09"/>
    <rect x="40" y="484" width="350" height="7"  rx="2" opacity="0.07"/>
    <rect x="40" y="500" width="400" height="7"  rx="2" opacity="0.07"/>
    <rect x="40" y="516" width="240" height="7"  rx="2" opacity="0.06"/>
  </g>

  <!-- Bottom rule -->
  <line x1="40" y1="548" x2="460" y2="548" stroke="#2A6B6B" stroke-width="0.5" opacity="0.12"/>

  <!-- Caption -->
  <text x="250" y="618" text-anchor="middle" fill="rgba(42,107,107,0.28)"
        font-family="sans-serif" font-size="10" letter-spacing="1.5">PLACEHOLDER · 500 × 630</text>
</svg>
