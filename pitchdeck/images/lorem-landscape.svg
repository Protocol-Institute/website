<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg-grad" cx="48%" cy="52%" r="70%">
      <stop offset="0%" stop-color="#235858"/>
