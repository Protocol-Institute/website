    <circle cx="500" cy="75"  r="10" fill="rgba(42,107,107,0.36)" stroke="rgba(255,255,255,0.20)"/>
  </g>

  <!-- Central hub -->
  <circle cx="400" cy="220" r="26" fill="rgba(42,107,107,0.55)" stroke="rgba(255,255,255,0.38)" stroke-width="2"/>
  <circle cx="400" cy="220" r="11" fill="rgba(255,255,255,0.65)"/>

  <!-- Caption -->
  <text x="400" y="438" text-anchor="middle" fill="rgba(255,255,255,0.18)"
