    <circle cx="215" cy="330" r="12" fill="rgba(42,107,107,0.42)" stroke="rgba(255,255,255,0.25)"/>
    <circle cx="625" cy="130" r="17" fill="rgba(42,107,107,0.50)" stroke="rgba(255,255,255,0.30)"/>
    <circle cx="695" cy="215" r="11" fill="rgba(42,107,107,0.38)" stroke="rgba(255,255,255,0.22)"/>
    <circle cx="655" cy="325" r="13" fill="rgba(42,107,107,0.42)" stroke="rgba(255,255,255,0.25)"/>
    <circle cx="385" cy="375" r="11" fill="rgba(42,107,107,0.38)" stroke="rgba(255,255,255,0.22)"/>
    <circle cx="490" cy="375" r="9"  fill="rgba(42,107,107,0.34)" stroke="rgba(255,255,255,0.18)"/>
