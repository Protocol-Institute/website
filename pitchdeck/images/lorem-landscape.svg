    <line x1="400" y1="220" x2="120" y2="235"/>
    <line x1="400" y1="220" x2="215" y2="330"/>
    <line x1="400" y1="220" x2="625" y2="130"/>
    <line x1="400" y1="220" x2="695" y2="215"/>
    <line x1="400" y1="220" x2="655" y2="325"/>
    <line x1="400" y1="220" x2="385" y2="375"/>
    <line x1="175" y1="130" x2="120" y2="235"/>
    <line x1="120" y1="235" x2="215" y2="330"/>
    <line x1="215" y1="330" x2="385" y2="375"/>
    <line x1="625" y1="130" x2="695" y2="215"/>
    <line x1="695" y1="215" x2="655" y2="325"/>
    <line x1="655" y1="325" x2="385" y2="375"/>
    <line x1="85"  y1="145" x2="175" y2="130"/>
    <line x1="715" y1="365" x2="655" y2="325"/>
    <line x1="490" y1="375" x2="385" y2="375"/>
    <line x1="490" y1="375" x2="655" y2="325"/>
    <line x1="310" y1="80"  x2="400" y2="220"/>
    <line x1="310" y1="80"  x2="175" y2="130"/>
    <line x1="500" y1="75"  x2="625" y2="130"/>
    <line x1="500" y1="75"  x2="400" y2="220"/>
