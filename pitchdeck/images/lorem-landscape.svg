  <circle cx="400" cy="220" r="155" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <circle cx="400" cy="220" r="220" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Edges -->
  <g stroke="rgba(255,255,255,0.11)" stroke-width="1" fill="none">
